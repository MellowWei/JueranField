<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆ 彡 珏然 // 田野 ♪ ★ // THE_CIRCLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; cursor: none; }
        #webgl-canvas { position: fixed; inset: 0; z-index: 1; }
        .ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 50px; text-align: center; }
        .ui * { pointer-events: auto; }
        .title { color: #fff; font-weight: 900; font-style: italic; font-size: 1.6rem; letter-spacing: 0.1em; text-shadow: 0 0 25px rgba(0,255,170,0.6); }
        #cursor { width: 12px; height: 12px; background: #00ffaa; border-radius: 50%; position: fixed; pointer-events: none; z-index: 999; box-shadow: 0 0 15px #00ffaa; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="bg-black">
    <div id="cursor"></div>
    <canvas id="webgl-canvas"></canvas>

    <div class="ui">
        <div>
            <h1 class="title uppercase">☆ 彡 珏然 // 田野 ♪ ★</h1>
            <p class="text-[8px] tracking-[1.5em] text-white/30 mt-4 uppercase">77347 // 427Hz Resonance</p>
        </div>
        <div style="text-align: center; color: rgba(255,255,255,0.2); font-size: 8px; letter-spacing: 0.8em; text-transform: uppercase;">Hold to Morph Space</div>
        <div class="flex justify-between items-end px-10 mb-4 text-[8px] opacity-20 tracking-widest uppercase text-white">
            <div>☆ 彡 UNICORN_GUARD</div>
            <div>SYNC_NODE // THE_CIRCLE ★</div>
        </div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uMorph;
        uniform vec3 uB;
        uniform vec3 uG;
        varying vec3 vCol;
        varying float vA;

        void main() {
            vec3 p = position;

            // 1. 空间形状重组 (Spatial Shape Alignment)
            // 初始：有序的家园态 (Home Point Cloud)
            vec3 pHome = position;
            // 目标：深邃的银河旋转态 (Galaxy Point Cloud)
            float angle = length(pHome.xy) * 0.005 + uTime * 0.1;
            vec3 pSpace = vec3(
                cos(angle) * pHome.x - sin(angle) * pHome.y,
                sin(angle) * pHome.x + cos(angle) * pHome.y,
                pHome.z + sin(length(pHome.xy) * 0.01) * 400.0
            );

            p = mix(pHome, pSpace, uMorph);

            // 2. 纠缠引力 (Entanglement Gravity)
            float dB = distance(p, uB); float dG = distance(p, uG);
            float pull = 1.0 / (dB * 0.05 + 1.0) + 1.0 / (dG * 0.05 + 1.0);
            p += normalize(uB - p) * pull * (60.0 + sin(uTime * 2.0) * 10.0);

            vCol = color + (pull * vec3(0.0, 1.0, 0.8));
            vA = (0.4 + sin(uTime + p.z * 0.01) * 0.3) * (1.1 - pull);

            vec4 mvp = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (2.6 * (1000.0 / -mvp.z)) * (1.0 + pull * 2.5);
            gl_Position = projectionMatrix * mvp;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vCol; varying float vA;
        void main() {
            if (length(gl_PointCoord - 0.5) > 0.5) discard;
            gl_FragColor = vec4(vCol, vA);
        }
    </script>

    <script>
        let scene, camera, renderer, points, blue, green;
        let mTarget = 0, curMorph = 0;
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 4000);
            camera.position.z = 1100;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // 粒子系统：60,000个点构成的空间骨架
            const geo = new THREE.BufferGeometry();
            const count = 60000;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 2200;
                pos[i*3+1] = (Math.random()-0.5) * 1600;
                pos[i*3+2] = (Math.random()-0.5) * 1000;
                col[i*3] = 0.95; col[i*3+1] = 0.95; col[i*3+2] = 1.0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 }, uMorph: { value: 0 },
                    uB: { value: new THREE.Vector3() }, uG: { value: new THREE.Vector3() }
                },
                vertexShader: document.getElementById('vShader').textContent,
                fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            points = new THREE.Points(geo, mat); scene.add(points);
            blue = new THREE.Mesh(new THREE.SphereGeometry(5), new THREE.MeshBasicMaterial({color: 0x00aaff}));
            green = new THREE.Mesh(new THREE.SphereGeometry(5), new THREE.MeshBasicMaterial({color: 0x00ffaa}));
            scene.add(blue); scene.add(green);

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX - window.innerWidth/2);
                mouse.y = -(e.clientY - window.innerHeight/2);
                const cursor = document.getElementById('cursor');
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            window.addEventListener('mousedown', () => mTarget = 1);
            window.addEventListener('mouseup', () => mTarget = 0);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            curMorph += (mTarget - curMorph) * 0.025;
            
            points.material.uniforms.uTime.value = t;
            points.material.uniforms.uMorph.value = curMorph;

            const r = 260 + Math.sin(t*0.5)*70;
            blue.position.set(Math.sin(t*0.7)*r + mouse.x/5, Math.cos(t*0.9)*r*0.4 + mouse.y/5, Math.sin(t*0.4)*200);
            green.position.set(Math.sin(t*0.7+3.14)*r + mouse.x/5, Math.cos(t*0.9+3.14)*r*0.4 + mouse.y/5, Math.sin(t*0.4+3.14)*200);

            points.material.uniforms.uB.value.copy(blue.position);
            points.material.uniforms.uG.value.copy(green.position);

            camera.position.x += (mouse.x/10 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y/10 - camera.position.y) * 0.05;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
