<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆ 彡 珏然 // 田野 ♪ ★ // THE_CIRCLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; cursor: none; }
        #canvas { position: fixed; inset: 0; }
        .ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; }
        .title { color: #fff; font-family: sans-serif; font-weight: 900; font-style: italic; font-size: 1.5rem; letter-spacing: 0.2em; text-align: center; pointer-events: auto; }
        #cursor { width: 10px; height: 10px; background: #00ffaa; border-radius: 50%; position: fixed; pointer-events: none; z-index: 999; box-shadow: 0 0 15px #00ffaa; }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <h1 class="title">☆ 彡 珏然 // 田野 ♪ ★</h1>
        <div style="text-align: center; color: rgba(255,255,255,0.2); font-size: 8px; letter-spacing: 1em;">HOLD TO MORPH SPACE</div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uMorph;
        uniform vec3 uB;
        uniform vec3 uG;
        varying vec3 vCol;
        varying float vA;

        // 伪随机函数用于生成空间厚度
        float hash(float n) { return fract(sin(n) * 43758.5453123); }

        void main() {
            // 初始形状：家的有序点阵 (稳固感)
            vec3 pHome = position;
            
            // 目标形状：宇宙的螺旋坍缩 (空间感)
            float angle = position.x * 0.002 + uTime * 0.2;
            float dist = length(position.xy);
            vec3 pSpace = vec3(
                cos(angle) * dist,
                sin(angle) * dist,
                sin(dist * 0.01) * 300.0 // 增加 Z 轴深度
            );

            // 叙事性 Morphing
            vec3 p = mix(pHome, pSpace, uMorph);

            // 互动纠缠：珏然(Blue)与田野(Green)的引力
            float dB = distance(p, uB);
            float dG = distance(p, uG);
            float pull = 1.0 / (dB * 0.05 + 1.0) + 1.0 / (dG * 0.05 + 1.0);
            
            p += normalize(uB - p) * pull * 60.0;
            p.z += hash(position.x) * 100.0 * uMorph; // 升维时的粒子散逸

            vCol = color + (pull * vec3(0.0, 1.0, 0.8));
            vA = (0.5 + sin(uTime + p.z * 0.01) * 0.3) * (1.0 - pull * 0.5);

            vec4 mvp = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (2.8 * (1000.0 / -mvp.z)) * (1.0 + pull * 3.0);
            gl_Position = projectionMatrix * mvp;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vCol; varying float vA;
        void main() {
            if (length(gl_PointCoord - 0.5) > 0.5) discard;
            gl_FragColor = vec4(vCol, vA);
        }
    </script>

    <script>
        let scene, camera, renderer, points, blue, green;
        let mTarget = 0, curMorph = 0;
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 4000);
            camera.position.z = 1100;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 1. 建立具有空间骨架的粒子系统 (60,000个点)
            const geo = new THREE.BufferGeometry();
            const count = 60000;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                // 模拟“家”的几何骨架：窗框、地面、墙角
                let x = (Math.random()-0.5) * 2000;
                let y = (Math.random()-0.5) * 1500;
                let z = (Math.random()-0.5) * 400;
                
                // 增加边缘稳固感：模拟照片里的结构线
                if(Math.random() > 0.9) { x = Math.sign(x) * 800; } 

                pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;

                // 初始颜色：暖色调 (对应 home1~4.jpg)
                col[i*3] = 0.9; col[i*3+1] = 0.7; col[i*3+2] = 0.6;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 }, uMorph: { value: 0 },
                    uB: { value: new THREE.Vector3() }, uG: { value: new THREE.Vector3() }
                },
                vertexShader: document.getElementById('vShader').textContent,
                fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            points = new THREE.Points(geo, mat); scene.add(points);

            // 核心实体
            blue = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshBasicMaterial({color: 0x00aaff}));
            green = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshBasicMaterial({color: 0x00ffaa}));
            scene.add(blue); scene.add(green);

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX - window.innerWidth/2);
                mouse.y = -(e.clientY - window.innerHeight/2);
                document.getElementById('cursor').style.left = e.clientX + 'px';
                document.getElementById('cursor').style.top = e.clientY + 'px';
            });
            window.addEventListener('mousedown', () => mTarget = 1);
            window.addEventListener('mouseup', () => mTarget = 0);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            curMorph += (mTarget - curMorph) * 0.02;
            
            points.material.uniforms.uTime.value = t;
            points.material.uniforms.uMorph.value = curMorph;

            const r = 280 + Math.sin(t*0.5)*50;
            blue.position.set(Math.sin(t*0.8)*r + mouse.x/4, Math.cos(t*1.1)*r*0.4 + mouse.y/4, Math.sin(t*0.5)*100);
            green.position.set(Math.sin(t*0.8+3.14)*r + mouse.x/4, Math.cos(t*1.1+3.14)*r*0.4 + mouse.y/4, Math.sin(t*0.5+3.14)*100);

            points.material.uniforms.uB.value.copy(blue.position);
            points.material.uniforms.uG.value.copy(green.position);

            camera.position.x += (mouse.x/10 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y/10 - camera.position.y) * 0.05;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
