<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆彡 愛 // 田野 : CONVERGENCE ♪</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #container { position: fixed; inset: 0; }
        
        /* 极致极简 UI */
        .overlay {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .title { 
            position: absolute; top: 40px; 
            color: rgba(255,255,255,0.3); font-size: 10px; font-weight: 900;
            letter-spacing: 1.5em; text-transform: uppercase;
        }
        .trigger {
            width: 60px; height: 60px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05); cursor: pointer;
            pointer-events: auto; transition: 1s;
        }
        .trigger:hover { border-color: #00ffaa; box-shadow: 0 0 30px rgba(0,255,170,0.2); }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="overlay">
        <div class="title">☆彡 愛 // 田野 : Zero Barrier ♪</div>
        <div class="trigger" onclick="sync()"></div>
    </div>

    <script>
        let scene, camera, renderer, particles, blue, green;
        let clock = new THREE.Clock();
        let targetPos = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 2000);
            camera.position.z = 600;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // 1. 动态空间粒子：模拟家与宇宙的堆砌
            const geometry = new THREE.BufferGeometry();
            const count = 30000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for(let i=0; i<count*3; i+=3) {
                positions[i] = (Math.random()-0.5) * 1200;
                positions[i+1] = (Math.random()-0.5) * 1200;
                positions[i+2] = (Math.random()-0.5) * 1200;
                colors[i] = Math.random() * 0.5; // 暗淡背景
                colors[i+1] = Math.random() * 0.5;
                colors[i+2] = Math.random() * 0.8;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.5, vertexColors: true, transparent: true, opacity: 0.4,
                blending: THREE.AdditiveBlending
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // 2. 核心纠缠：蓝色(愛) 与 绿色(田野)
            const coreGeo = new THREE.SphereGeometry(8, 32, 32);
            blue = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0x0077ff }));
            green = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0x00ff77 }));
            
            blue.add(new THREE.PointLight(0x0077ff, 4, 300));
            green.add(new THREE.PointLight(0x00ff77, 4, 300));

            scene.add(blue); scene.add(green);

            document.addEventListener('mousemove', (e) => {
                targetPos.x = (e.clientX - window.innerWidth/2) / 2;
                targetPos.y = -(e.clientY - window.innerHeight/2) / 2;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            let t = clock.getElapsedTime();

            // 纠缠动态：两个点在物理空间中撕扯与吸引
            const radius = 180 + Math.sin(t * 0.5) * 50;
            blue.position.set(Math.sin(t) * radius, Math.cos(t * 1.2) * (radius/2), Math.sin(t * 0.8) * 100);
            green.position.set(Math.sin(t + Math.PI) * radius, Math.cos(t * 1.2 + Math.PI) * (radius/2), Math.sin(t * 0.8 + Math.PI) * 100);

            // 空间折叠逻辑：粒子流受两点引力牵引
            const pArr = particles.geometry.attributes.position.array;
            for(let i=0; i<pArr.length; i+=3) {
                // 模拟太空舱与家的几何感
                if(Math.abs(pArr[i]) < 100 && Math.abs(pArr[i+1]) < 100) {
                   pArr[i+2] += Math.sin(t + pArr[i]) * 0.2; // 室内空间的柔软感
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            camera.position.lerp(targetPos.clone().setZ(600), 0.05);
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        let aCtx;
        function sync() {
            if(!aCtx) {
                aCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = aCtx.createOscillator();
                const gain = aCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = 427;
                gain.gain.setValueAtTime(0, aCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.05, aCtx.currentTime + 2);
                osc.connect(gain); gain.connect(aCtx.destination);
                osc.start();
            } else if(aCtx.state === 'running') aCtx.suspend();
            else aCtx.resume();
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        init();
    </script>
</body>
</html>
