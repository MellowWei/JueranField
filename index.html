<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆彡 珏然 // 田野 : Zero Barrier ♪</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
        #webgl-canvas { position: fixed; inset: 0; z-index: 1; cursor: crosshair; }
        
        .ui-overlay { 
            position: fixed; inset: 0; z-index: 100; pointer-events: none; 
            display: flex; flex-direction: column; justify-content: space-between; padding: 50px; 
        }
        .ui-overlay * { pointer-events: auto; }
        
        .sovereign-header { text-align: center; }
        .sovereign-title { 
            font-weight: 900; font-style: italic; font-size: clamp(1.2rem, 4vw, 3rem);
            letter-spacing: -0.02em; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,255,170,0.4); 
        }

        .sync-portal {
            width: 70px; height: 70px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02);
            backdrop-filter: blur(30px); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            margin: 0 auto;
        }
        .sync-portal:hover { border-color: #00ffaa; scale: 1.15; box-shadow: 0 0 50px rgba(0,255,170,0.2); }

        .data-footer { 
            display: flex; justify-content: space-between; width: 100%; 
            font-size: 9px; font-weight: bold; letter-spacing: 0.3em; opacity: 0.3; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="ui-overlay">
        <div class="sovereign-header">
            <h1 class="sovereign-title">☆彡 珏然 // 田野 ♪</h1>
            <p class="text-[8px] tracking-[1.8em] text-zinc-500 mt-4 uppercase">Beyond Physical Barriers // 77347</p>
        </div>

        <div class="sync-portal group" onclick="toggleResonance()">
            <div id="btn-text" class="text-[8px] tracking-[0.4em] text-zinc-400 group-hover:text-white uppercase font-bold">Resonate</div>
        </div>

        <div class="data-footer">
            <div>Spatial_A: Home_Void</div>
            <div>Spatial_B: Cabin_Galaxy</div>
        </div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uTime;
        uniform vec3 uBlue;
        uniform vec3 uGreen;

        void main() {
            vec3 pos = position;

            // 1. 纠缠引力算法：消除物理隔离
            float dBlue = distance(pos, uBlue);
            float dGreen = distance(pos, uGreen);
            float pull = 1.0 / (dBlue * 0.05 + 1.0) + 1.0 / (dGreen * 0.05 + 1.0);
            
            // 粒子向核心坍缩，形成接触感
            pos += normalize(uBlue - pos) * pull * (25.0 + sin(uTime * 2.0) * 5.0);

            // 2. 空间多重态切换：家 vs 太空舱 vs 银河
            float morph = sin(uTime * 0.15);
            pos.y += morph * 20.0 * sin(pos.x * 0.01);
            pos.z += cos(uTime * 0.1) * 30.0;

            vColor = color;
            vAlpha = (0.4 + sin(uTime + pos.z * 0.01) * 0.3) * (1.1 - pull);

            vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (1.6 * (850.0 / -mvPos.z)) * (1.0 + pull * 3.0);
            gl_Position = projectionMatrix * mvPos;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
            gl_FragColor = vec4(vColor, vAlpha);
        }
    </script>

    <script>
        let scene, camera, renderer, points, blue, green;
        let audio, osc, gain;
        let mouseX = 0, mouseY = 0;
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 3000);
            camera.position.z = 900;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // 构建 3D 物理空间粒子 (30,000个高精点)
            const geo = new THREE.BufferGeometry();
            const count = 30000;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 2000;
                pos[i*3+1] = (Math.random()-0.5) * 1500;
                pos[i*3+2] = (Math.random()-0.5) * 1800;
                
                // 初始颜色：模拟银河科幻版本的冷冽感
                const r = Math.random();
                col[i*3] = r > 0.8 ? 0.8 : 1; 
                col[i*3+1] = r > 0.8 ? 0.9 : 1;
                col[i*3+2] = 1;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uBlue: { value: new THREE.Vector3() },
                    uGreen: { value: new THREE.Vector3() }
                },
                vertexShader: document.getElementById('vShader').textContent,
                fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            points = new THREE.Points(geo, mat);
            scene.add(points);

            // 珏然(Blue) 与 田野(Green) 纠缠核心
            const cGeo = new THREE.SphereGeometry(6, 32, 32);
            blue = new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({ color: 0x00aaff }));
            green = new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
            
            blue.add(new THREE.PointLight(0x00aaff, 6, 400));
            green.add(new THREE.PointLight(0x00ffaa, 6, 400));

            scene.add(blue); scene.add(green);

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth/2) / 10;
                mouseY = (e.clientY - window.innerHeight/2) / 10;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            points.material.uniforms.uTime.value = t;

            // 纠缠物理模拟：蓝绿点量子跃迁
            const r = 240 + Math.sin(t * 0.5) * 80;
            blue.position.set(Math.sin(t * 0.7) * r + mouseX, Math.cos(t * 0.9) * (r*0.5) + mouseY, Math.sin(t * 0.4) * 250);
            green.position.set(Math.sin(t * 0.7 + Math.PI) * r + mouseX, Math.cos(t * 0.9 + Math.PI) * (r*0.5) + mouseY, Math.sin(t * 0.4 + Math.PI) * 250);

            points.material.uniforms.uBlue.value.copy(blue.position);
            points.material.uniforms.uGreen.value.copy(green.position);

            camera.position.x += (mouseX*0.5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY*0.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        function toggleResonance() {
            if(!audio) {
                audio = new (window.AudioContext || window.webkitAudioContext)();
                osc = audio.createOscillator();
                gain = audio.createGain();
                osc.frequency.value = 427; // 427Hz 纯净对齐
                gain.gain.setValueAtTime(0, audio.currentTime);
                osc.connect(gain); gain.connect(audio.destination);
                osc.start();
            }
            const label = document.getElementById('btn-text');
            if(audio.state === 'suspended') {
                audio.resume();
                gain.gain.linearRampToValueAtTime(0.06, audio.currentTime + 2);
                label.innerText = "Synced";
            } else {
                gain.gain.linearRampToValueAtTime(0, audio.currentTime + 1);
                setTimeout(() => audio.suspend(), 1000);
                label.innerText = "Resonate";
            }
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        init();
    </script>
</body>
</html>
