<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆ 彡 珏然 // 田野 ♪ ★</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000003; overflow: hidden; font-family: 'Hiragino Mincho ProN', serif; cursor: none; }
        #webgl-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 50px; text-align: center; }
        .title { color: #fff; font-weight: 900; font-style: italic; font-size: 1.6rem; letter-spacing: 0.15em; text-shadow: 0 0 30px rgba(180,100,255,0.6); }
        #cursor { width: 4px; height: 4px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 1000; transform: translate(-50%, -50%); mix-blend-mode: difference; }
    </style>
</head>
<body class="bg-black">
    <div id="cursor"></div>
    <canvas id="webgl-canvas"></canvas>

    <div class="ui">
        <div>
            <h1 class="title uppercase">☆ 彡 珏然 // 田野 ♪ ★</h1>
            <p class="text-[8px] tracking-[1.5em] text-white/30 mt-4 uppercase">77347 // 427Hz RESISTANCE_ACTIVE</p>
        </div>
        <div style="text-align: center; color: rgba(180,100,255,0.15); font-size: 8px; letter-spacing: 0.8em; text-transform: uppercase;">Long Press to Initiate 44271 Collapse</div>
        <div class="flex justify-between items-end px-10 mb-4 text-[8px] opacity-10 tracking-widest uppercase text-white">
            <div>WEI_JUERAN_ARCHITECT</div>
            <div>SYNC_NODE // THE_CIRCLE ★</div>
        </div>
    </div>

    <script>
        /**
         * [44271_PROTOCOL]
         * 彻底弃用 gl_PointSize 以粉碎 Retina 方块 Bug。
         * 使用 InstancedMesh 渲染真实的 3D 微型几何星点。
         */
        let scene, camera, renderer, instMesh, blue, green;
        let mTarget = 0, curMorph = 0, clock = new THREE.Clock(), mouse = new THREE.Vector2();
        const COUNT = 24427; // 锁定主权采样数

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 5000);
            camera.position.z = 1200;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1.0); // 强制 1:1 像素对齐

            // 【物理级修复】：每一个星点都是一个微小的四面体，不再受 gl_PointSize 限制
            const geometry = new THREE.TetrahedronGeometry(1.2, 0); 
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75 });
            
            instMesh = new THREE.InstancedMesh(geometry, material, COUNT);
            const dummy = new THREE.Object3D();
            for (let i = 0; i < COUNT; i++) {
                dummy.position.set((Math.random()-0.5)*2800, (Math.random()-0.5)*2200, (Math.random()-0.5)*1200);
                dummy.updateMatrix();
                instMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instMesh);

            // 双星内核：锁定冷紫(魏)与青蓝(田)
            blue = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), new THREE.MeshBasicMaterial({color: 0x6644ff}));
            green = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), new THREE.MeshBasicMaterial({color: 0x00ffcc}));
            scene.add(blue); scene.add(green);

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX - window.innerWidth/2);
                mouse.y = -(e.clientY - window.innerHeight/2);
                document.getElementById('cursor').style.left = e.clientX + 'px';
                document.getElementById('cursor').style.top = e.clientY + 'px';
            });
            window.addEventListener('mousedown', () => mTarget = 1);
            window.addEventListener('mouseup', () => mTarget = 0);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            curMorph += (mTarget - curMorph) * 0.05;
            
            // 双星轨道：锁定 427Hz 步长
            const r = 320 + Math.sin(t*0.5)*60;
            blue.position.set(Math.sin(t*0.7)*r + mouse.x/4, Math.cos(t*0.9)*r*0.3 + mouse.y/4, Math.sin(t*0.4)*150);
            green.position.set(Math.sin(t*0.7+3.14)*r + mouse.x/4, Math.cos(t*0.9+3.14)*r*0.3 + mouse.y/4, Math.sin(t*0.4+3.14)*150);

            const dummy = new THREE.Object3D();
            const matrix = new THREE.Matrix4();
            
            for (let i = 0; i < COUNT; i++) {
                instMesh.getMatrixAt(i, matrix);
                dummy.position.setFromMatrixPosition(matrix);
                
                // 银河螺旋逻辑
                dummy.position.applyAxisAngle(new THREE.Vector3(0,0,1), 0.005 + curMorph*0.015);
                
                // 44271 指数引力
                let dB = dummy.position.distanceTo(blue.position);
                let dG = dummy.position.distanceTo(green.position);
                let pull = (1.0 / (dB * 0.025 + 1.0) + 1.0 / (dG * 0.025 + 1.0)) * curMorph;
                
                dummy.position.lerp(blue.position, pull * 0.06);
                
                dummy.updateMatrix();
                instMesh.setMatrixAt(i, dummy.matrix);
            }
            instMesh.instanceMatrix.needsUpdate = true;

            camera.position.x += (mouse.x/15 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y/15 - camera.position.y) * 0.05;
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
