<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>44271_SOVEREIGN_RESISTANCE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; cursor: none; }
        canvas { position: fixed; inset: 0; z-index: 1; }
        #cursor { width: 4px; height: 4px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 1000; transform: translate(-50%, -50%); mix-blend-mode: difference; }
        .title { position: fixed; top: 40px; width: 100%; text-align: center; color: #fff; font-weight: 900; italic; letter-spacing: 0.3em; z-index: 100; opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <div class="title uppercase">田野 // 魏珏然 // 44271_FIXED</div>
    <canvas id="stage"></canvas>

    <script>
        let scene, camera, renderer, instMesh, blue, green;
        let mTarget = 0, curMorph = 0, clock = new THREE.Clock(), mouse = new THREE.Vector2();
        const COUNT = 30000; // 降低数量，提升单点质感

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 5000);
            camera.position.z = 1200;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1.0); // 强制 1:1，杜绝 Retina 导致的尺寸畸变

            // 【核心修复】：不再使用 Points，改用微小的 3D 几何体
            // 这是一个四面体，它在任何缩放级别下都是尖锐、精致的星点
            const geometry = new THREE.TetrahedronGeometry(1.5, 0); 
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
            
            instMesh = new THREE.InstancedMesh(geometry, material, COUNT);
            
            const dummy = new THREE.Object3D();
            for (let i = 0; i < COUNT; i++) {
                dummy.position.set((Math.random()-0.5)*3000, (Math.random()-0.5)*2000, (Math.random()-0.5)*1500);
                dummy.updateMatrix();
                instMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instMesh);

            blue = new THREE.Mesh(new THREE.SphereGeometry(6, 12, 12), new THREE.MeshBasicMaterial({color: 0x6644ff}));
            green = new THREE.Mesh(new THREE.SphereGeometry(6, 12, 12), new THREE.MeshBasicMaterial({color: 0x00ffcc}));
            scene.add(blue); scene.add(green);

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX - window.innerWidth/2);
                mouse.y = -(e.clientY - window.innerHeight/2);
                document.getElementById('cursor').style.left = e.clientX + 'px';
                document.getElementById('cursor').style.top = e.clientY + 'px';
            });
            window.addEventListener('mousedown', () => mTarget = 1);
            window.addEventListener('mouseup', () => mTarget = 0);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            curMorph += (mTarget - curMorph) * 0.05;
            
            const r = 320 + Math.sin(t*0.5)*60;
            blue.position.set(Math.sin(t*0.7)*r + mouse.x/4, Math.cos(t*0.9)*r*0.3 + mouse.y/4, Math.sin(t*0.4)*100);
            green.position.set(Math.sin(t*0.7+3.14)*r + mouse.x/4, Math.cos(t*0.9+3.14)*r*0.3 + mouse.y/4, Math.sin(t*0.4+3.14)*100);

            const dummy = new THREE.Object3D();
            const matrix = new THREE.Matrix4();
            
            for (let i = 0; i < COUNT; i++) {
                instMesh.getMatrixAt(i, matrix);
                dummy.position.setFromMatrixPosition(matrix);
                
                // 427Hz 螺旋步长
                dummy.position.applyAxisAngle(new THREE.Vector3(0,0,1), 0.005 + curMorph*0.02);
                
                // 纠缠引力
                let dB = dummy.position.distanceTo(blue.position);
                let dG = dummy.position.distanceTo(green.position);
                let pull = (1.0 / (dB * 0.02 + 1.0) + 1.0 / (dG * 0.02 + 1.0)) * curMorph;
                dummy.position.lerp(blue.position, pull * 0.05);
                
                dummy.updateMatrix();
                instMesh.setMatrixAt(i, dummy.matrix);
            }
            instMesh.instanceMatrix.needsUpdate = true;

            camera.position.x += (mouse.x/15 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y/15 - camera.position.y) * 0.05;
            camera.lookAt(0,0,0);
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
