<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆彡 珏然 // 田野 ♪ // THE_CIRCLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .ui { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 40px; pointer-events: none; color: rgba(255,255,255,0.7); text-align: center; }
        .ui * { pointer-events: auto; }
        .title { font-weight: 900; font-style: italic; letter-spacing: 0.2em; text-shadow: 0 0 20px rgba(0,255,170,0.4); }
        .sync-btn { width: 80px; height: 80px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); backdrop-filter: blur(20px); cursor: pointer; margin: 0 auto; display: flex; align-items: center; justify-content: center; transition: 1s cubic-bezier(0.19, 1, 0.22, 1); }
        .sync-btn:hover { border-color: #00ffaa; transform: scale(1.1) rotate(90deg); }
    </style>
</head>
<body class="bg-black">
    <canvas id="canvas"></canvas>
    <div class="ui">
        <div>
            <h1 class="text-2xl lg:text-4xl title uppercase">☆彡 珏然 // 田野 ♪</h1>
            <p class="text-[8px] tracking-[1.5em] opacity-40 mt-4 uppercase">THE_CIRCLE // ZERO_BARRIER</p>
        </div>
        <div class="sync-btn group" onclick="toggleResonance()">
            <span class="text-[8px] tracking-[0.3em] opacity-50 group-hover:opacity-100 font-bold">RESONATE</span>
        </div>
        <div class="w-full flex justify-between items-end px-10 mb-4 text-[8px] opacity-30 tracking-widest uppercase">
            <div>☆彡 UNICORN_GUARD</div>
            <div>427Hz // SYNC_NODE</div>
        </div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform sampler2D uTexHome;
        uniform sampler2D uTexGalaxy;
        varying vec3 vCol;
        varying float vA;

        void main() {
            vec3 p = position;
            
            // 空间 Morphing 逻辑：在不同照片色彩间切换
            float wave = sin(uTime * 0.2) * 0.5 + 0.5;
            vec2 uv = vec2(p.x / 2000.0 + 0.5, p.y / 2000.0 + 0.5);
            vec3 cHome = texture2D(uTexHome, uv).rgb;
            vec3 cGalaxy = texture2D(uTexGalaxy, uv).rgb;
            
            // 纠缠奇点
            vec2 b = vec2(sin(uTime * 0.5) * 200.0, cos(uTime * 0.3) * 150.0);
            vec2 g = vec2(sin(uTime * 0.5 + 3.14) * 200.0, cos(uTime * 0.3 + 3.14) * 150.0);
            float dB = distance(p.xy, b);
            float dG = distance(p.xy, g);
            float pull = 1.0 / (dB * 0.04 + 1.0) + 1.0 / (dG * 0.04 + 1.0);
            
            p += normalize(p) * pull * 50.0;
            p.z += sin(uTime * 0.5 + p.x * 0.01) * 30.0;

            vCol = mix(cHome, cGalaxy, wave) + (pull * vec3(0.0, 1.0, 0.8));
            vA = (0.3 + sin(uTime + p.z * 0.01) * 0.2) * (1.1 - pull);

            vec4 mvp = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (2.8 * (850.0 / -mvp.z)) * (1.0 + pull * 2.0);
            gl_Position = projectionMatrix * mvp;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vCol;
        varying float vA;
        void main() {
            if (length(gl_PointCoord - 0.5) > 0.5) discard;
            gl_FragColor = vec4(vCol, vA);
        }
    </script>

    <script>
        let scene, camera, renderer, points, aCtx, osc, gain;
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 3000);
            camera.position.z = 900;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const loader = new THREE.TextureLoader();
            // 异步加载你上传的照片
            const texHome = loader.load('./home.jpg');
            const texGalaxy = loader.load('./galaxy.jpg');

            const geo = new THREE.BufferGeometry();
            const count = 30000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 2200;
                pos[i*3+1] = (Math.random()-0.5) * 1800;
                pos[i*3+2] = (Math.random()-0.5) * 1500;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: { 
                    uTime: { value: 0 },
                    uTexHome: { value: texHome },
                    uTexGalaxy: { value: texGalaxy }
                },
                vertexShader: document.getElementById('vShader').textContent,
                fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            points = new THREE.Points(geo, mat);
            scene.add(points);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            points.material.uniforms.uTime.value = t;
            renderer.render(scene, camera);
        }

        function toggleResonance() {
            if(!aCtx) {
                aCtx = new (window.AudioContext || window.webkitAudioContext)();
                osc = aCtx.createOscillator(); gain = aCtx.createGain();
                osc.frequency.value = 427; gain.gain.value = 0;
                osc.connect(gain); gain.connect(aCtx.destination);
                osc.start();
            }
            aCtx.state === 'suspended' ? (aCtx.resume(), gain.gain.linearRampToValueAtTime(0.05, aCtx.currentTime + 2)) : (gain.gain.linearRampToValueAtTime(0, aCtx.currentTime + 1), setTimeout(() => aCtx.suspend(), 1000));
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        init();
    </script>
</body>
</html>
