<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆ 彡 珏然 // 田野 ♪ ★ // THE_CIRCLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
        #webgl-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .circle-ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 40px; text-align: center; }
        .circle-ui * { pointer-events: auto; }
        .glitch-title { text-shadow: 0 0 20px rgba(0,255,170,0.6); font-style: italic; font-weight: 900; letter-spacing: 0.05em; }
        .sync-portal { width: 85px; height: 85px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); backdrop-filter: blur(25px); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 1.2s cubic-bezier(0.19, 1, 0.22, 1); margin: 0 auto; }
        .sync-portal:hover { border-color: #00ffaa; scale: 1.1; box-shadow: 0 0 50px rgba(0,255,170,0.25); transform: rotate(90deg); }
    </style>
</head>
<body class="bg-black">
    <canvas id="webgl-canvas"></canvas>
    <div class="circle-ui">
        <div>
            <h1 class="text-2xl lg:text-5xl glitch-title uppercase">☆ 彡 珏然 // 田野 ♪ ★</h1>
            <p class="text-[8px] tracking-[1.6em] text-zinc-500 mt-4 uppercase">Zero Barrier // 77347 // THE_CIRCLE</p>
        </div>
        <div class="sync-portal group" onclick="toggleConvergence()">
            <div id="btn-label" class="text-[8px] tracking-[0.4em] text-zinc-400 group-hover:text-white uppercase font-bold">Resonate</div>
        </div>
        <div class="flex justify-between items-end px-10 mb-4 text-[8px] opacity-30 tracking-widest uppercase">
            <div>☆ 彡 UNICORN_GUARD</div>
            <div>427Hz // SYNC_NODE ★</div>
        </div>
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform vec3 uBlueCore;
        uniform vec3 uGreenCore;
        uniform sampler2D uTexHome;
        uniform sampler2D uTexGalaxy;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            vec3 pos = position;

            // 粒子空间 Morphing 采样
            vec2 uv = vec2(pos.x / 2000.0 + 0.5, pos.y / 2000.0 + 0.5);
            vec3 colorHome = texture2D(uTexHome, uv).rgb;
            vec3 colorGalaxy = texture2D(uTexGalaxy, uv).rgb;
            
            float wave = sin(uTime * 0.1) * 0.5 + 0.5;
            vec3 mixedColor = mix(colorHome, colorGalaxy, wave);
            
            // 纠缠引力算法
            float distToBlue = distance(pos, uBlueCore);
            float distToGreen = distance(pos, uGreenCore);
            float pull = 1.0 / (distToBlue * 0.05 + 1.0) + 1.0 / (distToGreen * 0.05 + 1.0);
            
            // 粒子向核心坍缩
            pos += normalize(uBlueCore - pos) * pull * (35.0 + sin(uTime * 2.0) * 10.0);
            pos.z += cos(uTime * 0.5 + pos.x * 0.01) * 20.0;

            vColor = mixedColor + (pull * vec3(0.0, 1.0, 0.7));
            vAlpha = (0.35 + sin(uTime + pos.z * 0.01) * 0.25) * (1.1 - pull);

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (2.5 * (850.0 / -mvPosition.z)) * (1.0 + pull * 2.5);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
            gl_FragColor = vec4(vColor, vAlpha);
        }
    </script>

    <script>
        let scene, camera, renderer, particles, blue, green;
        let audioCtx, osc, gain;
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector2();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 3000);
            camera.position.z = 950;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const loader = new THREE.TextureLoader();
            // 确保这些文件存在于根目录
            const texHome = loader.load('./home.jpg'); 
            const texGalaxy = loader.load('./galaxy.jpg');

            const geo = new THREE.BufferGeometry();
            const count = 30000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 2200;
                pos[i*3+1] = (Math.random()-0.5) * 1800;
                pos[i*3+2] = (Math.random()-0.5) * 2000;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uBlueCore: { value: new THREE.Vector3() },
                    uGreenCore: { value: new THREE.Vector3() },
                    uTexHome: { value: texHome },
                    uTexGalaxy: { value: texGalaxy }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);

            // 核心实体：珏然 & 田野
            const cGeo = new THREE.SphereGeometry(6, 32, 32);
            blue = new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({ color: 0x00aaff }));
            green = new THREE.Mesh(cGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
            scene.add(blue); scene.add(green);

            document.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX - window.innerWidth/2) / 10;
                mouse.y = -(e.clientY - window.innerHeight/2) / 10;
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if(particles) particles.material.uniforms.uTime.value = t;

            const radius = 240 + Math.sin(t * 0.4) * 60;
            blue.position.set(Math.sin(t * 0.7) * radius + mouse.x, Math.cos(t * 0.9) * (radius*0.5) + mouse.y, Math.sin(t * 0.4) * 200);
            green.position.set(Math.sin(t * 0.7 + 3.14) * radius + mouse.x, Math.cos(t * 0.9 + 3.14) * (radius*0.5) + mouse.y, Math.sin(t * 0.4 + 3.14) * 200);

            if(particles) {
                particles.material.uniforms.uBlueCore.value.copy(blue.position);
                particles.material.uniforms.uGreenCore.value.copy(green.position);
            }

            camera.position.x += (mouse.x * 0.4 - camera.position.x) * 0.05;
            camera.position.y += (-mouse.y * 0.4 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        function toggleConvergence() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                osc = audioCtx.createOscillator(); gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(427, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
                gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 1.5);
                document.getElementById('btn-label').innerText = "SYNCED";
            } else {
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
                setTimeout(() => audioCtx.suspend(), 1000);
                document.getElementById('btn-label').innerText = "RESONATE";
            }
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        init();
    </script>
</body>
</html>
