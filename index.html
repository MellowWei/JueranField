<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆ 彡 珏然 // 田野 ♪ ★ // THE_CIRCLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; cursor: crosshair; }
        #canvas { position: fixed; inset: 0; z-index: 1; }
        .ui { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; text-align: center; }
        .ui * { pointer-events: auto; }
        .title { color: #fff; font-weight: 900; font-style: italic; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 25px rgba(0,255,170,0.5); }
        .footer { font-size: 8px; color: rgba(255,255,255,0.25); letter-spacing: 0.4em; text-transform: uppercase; }
    </style>
</head>
<body class="bg-black">
    <canvas id="canvas"></canvas>
    <div class="ui">
        <div>
            <h1 class="title uppercase">☆ 彡 珏然 // 田野 ♪ ★</h1>
            <p style="font-size: 7px; color: rgba(255,255,255,0.3); margin-top: 10px; letter-spacing: 1em;">INTERACTIVE_SPATIAL_NARRATIVE</p>
        </div>
        <div class="footer">Zero Barrier // 77347 // 427Hz Node</div>
    </div>

    <script id="vShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uMorph;
        uniform vec3 uB;
        uniform vec3 uG;
        uniform sampler2D uHome;
        uniform sampler2D uSpace;
        varying vec3 vCol;
        varying float vA;

        void main() {
            vec3 p = position;
            vec2 uv = vec2(p.x / 2000.0 + 0.5, p.y / 2000.0 + 0.5);
            
            // 叙事性采样：从家到宇宙的质感迁移
            vec3 cH = texture2D(uHome, uv).rgb;
            vec3 cS = texture2D(uSpace, uv).rgb;
            
            // 纠缠物理
            float dB = distance(p, uB); float dG = distance(p, uG);
            float pull = 1.0 / (dB * 0.04 + 1.0) + 1.0 / (dG * 0.04 + 1.0);
            
            // 流动而稳固的算法：当 uMorph 变化时，空间重构
            p += normalize(uB - p) * pull * (40.0 + sin(uTime)*10.0);
            p.z += sin(uTime * 0.5 + p.x * 0.02) * 15.0 * (1.0 - uMorph);

            vCol = mix(cH, cS, uMorph) + (pull * vec3(0.0, 1.0, 0.7));
            vA = (0.4 + sin(uTime + p.z * 0.01) * 0.25) * (1.1 - pull);

            vec4 mvp = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (2.5 * (900.0 / -mvp.z)) * (1.0 + pull * 2.5);
            gl_Position = projectionMatrix * mvp;
        }
    </script>
    <script id="fShader" type="x-shader/x-fragment">
        varying vec3 vCol; varying float vA;
        void main() {
            if (length(gl_PointCoord - 0.5) > 0.5) discard;
            gl_FragColor = vec4(vCol, vA);
        }
    </script>

    <script>
        let scene, camera, renderer, points, blue, green;
        let mTarget = 0, curMorph = 0;
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 3000);
            camera.position.z = 950;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const loader = new THREE.TextureLoader();
            // 文件名强制对齐
            const tH = loader.load('./home1.jpg'); 
            const tS = loader.load('./space.jpg');

            const geo = new THREE.BufferGeometry();
            const count = 45000; // 粒子加密，提升叙事精细度
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5)*2200;
                pos[i*3+1] = (Math.random()-0.5)*1600;
                pos[i*3+2] = (Math.random()-0.5)*1200;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 }, uMorph: { value: 0 },
                    uB: { value: new THREE.Vector3() }, uG: { value: new THREE.Vector3() },
                    uHome: { value: tH }, uSpace: { value: tS }
                },
                vertexShader: document.getElementById('vShader').textContent,
                fragmentShader: document.getElementById('fShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            points = new THREE.Points(geo, mat); scene.add(points);
            blue = new THREE.Mesh(new THREE.SphereGeometry(6,32,32), new THREE.MeshBasicMaterial({color: 0x00aaff}));
            green = new THREE.Mesh(new THREE.SphereGeometry(6,32,32), new THREE.MeshBasicMaterial({color: 0x00ffaa}));
            scene.add(blue); scene.add(green);

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX - window.innerWidth/2);
                mouse.y = -(e.clientY - window.innerHeight/2);
            });
            // 互动性逻辑：点击进入太空舱/宇宙叙事，松开回归家园
            window.addEventListener('mousedown', () => mTarget = 1);
            window.addEventListener('mouseup', () => mTarget = 0);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            curMorph += (mTarget - curMorph) * 0.03;
            
            points.material.uniforms.uTime.value = t;
            points.material.uniforms.uMorph.value = curMorph;

            const r = 240 + Math.sin(t*0.4)*60;
            blue.position.set(Math.sin(t*0.8)*r + mouse.x/6, Math.cos(t*1.1)*r*0.5 + mouse.y/6, Math.sin(t*0.5)*200);
            green.position.set(Math.sin(t*0.8+3.14)*r + mouse.x/6, Math.cos(t*1.1+3.14)*r*0.5 + mouse.y/6, Math.sin(t*0.5+3.14)*200);

            points.material.uniforms.uB.value.copy(blue.position);
            points.material.uniforms.uG.value.copy(green.position);

            camera.position.x += (mouse.x/12 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y/12 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
