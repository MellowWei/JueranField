<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆ 彡 珏然 // 田野 ♪ ★ // THE_CIRCLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; cursor: crosshair; }
        #webgl-canvas { position: fixed; inset: 0; z-index: 1; }
        .ui-interface { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; text-align: center; }
        .ui-interface * { pointer-events: auto; }
        .title { color: #fff; font-weight: 900; font-style: italic; font-size: 1.5rem; letter-spacing: 0.15em; text-shadow: 0 0 20px rgba(0,255,170,0.5); transform: preserve-3d; }
        .hint { color: rgba(255,255,255,0.2); font-size: 9px; margin-top: 10px; letter-spacing: 1.2em; text-transform: uppercase; }
        .footer-data { font-size: 8px; color: rgba(255,255,255,0.1); letter-spacing: 0.3em; text-transform: uppercase; display: flex; justify-content: space-between; padding: 0 60px; }
    </style>
</head>
<body class="bg-black">
    <canvas id="webgl-canvas"></canvas>
    <div class="ui-interface">
        <div>
            <h1 class="title uppercase">☆ 彡 珏然 // 田野 ♪ ★</h1>
            <p class="hint">Zero Barrier // 427Hz Resonance // 77347</p>
        </div>
        <div class="footer-data">
            <div>Spatial_A: Home_ Void // 精细室内堆砌</div>
            <div>Spatial_B: Cabin_ Void // GALAXY_科幻版本</div>
        </div>
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uMorph;
        uniform vec3 uBlueCore;
        uniform vec3 uGreenCore;
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            vec3 p = position;
            
            // 空间 Morphing：家 (有序) -> 银河 (混沌)
            // 初始形状：简约家具、床、植物的几何骨架
            vec3 pHome = position;
            
            // 目标形状：太空舱舷窗、银河涡旋
            float angle = pHome.x * 0.002 + uTime * 0.2;
            float dist = length(pHome.xy);
            vec3 pSpace = vec3(
                cos(angle) * dist * 1.5,
                sin(angle) * dist * 1.5,
                sin(dist * 0.01) * 300.0 // 增加 Z 轴深度模拟太空舱空间
            );

            // 执行多维 Morphing
            p = mix(pHome, pSpace, uMorph);

            // 纠缠引力：珏然(Blue)与田野(Green)的碰撞
            float distToBlue = distance(p, uBlueCore);
            float distToGreen = distance(p, uGreenCore);
            float pull = 1.0 / (distToBlue * 0.04 + 1.0) + 1.0 / (distToGreen * 0.04 + 1.0);
            
            // 消除物理隔离：粒子向核心坍缩，形成接触感
            p += normalize(uBlueCore - p) * pull * (25.0 + sin(uTime)*5.0);
            p.z += sin(uTime * 0.5 + p.x * 0.02) * 20.0 * (1.1 - uMorph);

            vColor = color + (pull * vec3(0.0, 1.0, 0.7)); // 糾缠時爆发蓝色輝光
            vAlpha = (0.4 + sin(uTime + p.z * 0.005) * 0.3) * (1.1 - pull); // 呼吸态透明度

            vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (2.4 * (950.0 / -mvPosition.z)) * (1.0 + pull * 3.0);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
            // 极致纯净与灵气的点，无贴图干扰
            if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
            gl_FragColor = vec4(vColor, vAlpha);
        }
    </script>

    <script>
        let scene, camera, renderer, particles, blue, green;
        let mTarget = 0, curMorph = 0;
        let mouseX = 0, mouseY = 0;
        const clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 1, 3500);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 1. 生成 30,000 个高精灵气粒子
            const geo = new THREE.BufferGeometry();
            const count = 30000;
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                // 初始化：模拟温润室内的几何堆砌感
                pos[i*3] = (Math.random()-0.5) * 2000;
                pos[i*3+1] = (Math.random()-0.5) * 1500;
                pos[i*3+2] = (Math.random()-0.5) * 1200;
                
                colors[i*3] = Math.random() > 0.5 ? 0.9 : 1;     // R
                colors[i*3+1] = Math.random() > 0.5 ? 1 : 1;     // G
                colors[i*3+2] = Math.random() > 0.5 ? 0.9 : 1;   // B
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uMorph: { value: 0 },
                    uBlueCore: { value: new THREE.Vector3() },
                    uGreenCore: { value: new THREE.Vector3() }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);

            // 珏然(Blue) 与 田野(Green) 核心纠缠
            const coreGeo = new THREE.SphereGeometry(6, 32, 32);
            blue = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0x00aaff }));
            green = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
            blue.add(new THREE.PointLight(0x00aaff, 5, 400));
            green.add(new THREE.PointLight(0x00ffaa, 5, 400));
            scene.add(blue); scene.add(green);

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth/2) / 10;
                mouseY = -(e.clientY - window.innerHeight/2) / 10;
            });
            // 互动：长按切换空间
            document.addEventListener('mousedown', () => mTarget = 1);
            document.addEventListener('mouseup', () => mTarget = 0);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            
            // 叙事 Morphing：平滑切换
            curMorph += (mTarget - curMorph) * 0.02;
            particles.material.uniforms.uMorph.value = curMorph;
            particles.material.uniforms.uTime.value = t;

            // 核心纠缠算法：量子追逐
            const radius = 240 + Math.sin(t * 0.5) * 60;
            blue.position.set(Math.sin(t * 0.8) * radius + mouseX, Math.cos(t * 1.1) * (radius*0.6) + mouseY, Math.sin(t * 0.5) * 200);
            green.position.set(Math.sin(t * 0.8 + 3.14) * radius + mouseX, Math.cos(t * 1.1 + 3.14) * (radius*0.6) + mouseY, Math.sin(t * 0.5 + 3.14) * 200);

            // 粒子 Uniform 同步
            particles.material.uniforms.uBlueCore.value.copy(blue.position);
            particles.material.uniforms.uGreenCore.value.copy(green.position);

            // 手势控制视差
            camera.position.x += (mouseX*0.8 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY*0.8 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
